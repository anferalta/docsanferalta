<VirtualHost *:80>
    ServerName anferalta.local
    ServerAlias anferaltadocs.local
    Redirect permanent / https://anferalta.local/
</VirtualHost>

<VirtualHost *:443>
    ServerName anferalta.local
    ServerAlias anferaltadocs.local
    DocumentRoot "C:/wamp/www/anferalta/anferaltadocs/public"
    DirectoryIndex index.php
    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile "C:/wamp/www/anferalta/anferaltadocs/secrets/tls/anferalta.local.pem"
    SSLCertificateKeyFile "C:/wamp/www/anferalta/anferaltadocs/secrets/tls/anferalta.local-key.pem"
    <Directory "C:/wamp/www/anferalta/anferaltadocs">
        AllowOverride None
        Require all denied
    </Directory>
    <Directory "C:/wamp/www/anferalta/anferaltadocs/public">
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
